name: full-suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system Qt dependencies for PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1

      - name: Install package (all extras)
        run: python -m pip install -e ".[all,dev,docs]"

      - name: Run full test suite with coverage
        run: pytest --cov
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build docs
        run: sphinx-build -W -b html docs docs/_build/html
