name: smoke

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (core + dev only)
        run: python -m pip install -e ".[dev]"

      - name: Run smoke tests
        run: pytest -m smoke --no-cov
